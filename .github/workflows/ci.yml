name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: modular_commerce
      DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_MIGRATOR_PASSWORD: ci-migrator
      DATABASE_APP_PASSWORD: ci-app
      DATABASE_AUTH_PASSWORD: ci-auth
      DATABASE_OPS_PASSWORD: ci-ops
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      AUTH_RATE_LIMIT: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Base de datos (roles + migraciones)
        run: pnpm --filter @mc/db bootstrap && pnpm db:migrate
      - name: Tests unitarios y de API
        run: pnpm --filter @mc/core test && pnpm --filter @mc/commerce-api test
      - name: Suite de aislamiento (Gate C)
        run: pnpm test:isolation
      - name: Controles negativos (la suite DEBE fallar con cada sabotaje)
        run: |
          for mode in rls-off permissive membership; do
            if ISOLATION_SABOTAGE=$mode pnpm test:isolation > /tmp/sabotage-$mode.log 2>&1; then
              echo "::error::La suite de aislamiento NO detectó el sabotaje '$mode'"; exit 1
            else
              echo "Sabotaje '$mode' detectado: $(grep -E 'Tests ' /tmp/sabotage-$mode.log | tail -1)"
            fi
          done
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high
